[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prepfreex"
version = "0.2.0"
description = "Autonomous Ingestion and Assessment Engines for PrepFreeX"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24.0",
  "pydantic>=2.7.0",
  "typer>=0.12.0",
  "python-dotenv>=1.0.0",
  "jsonschema>=4.22.0",
  "psycopg[binary]>=3.2.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "Pillow>=10.0.0",
  "pytesseract>=0.3.10",
  "google-genai>=2.0.0",
  "streamlit>=1.35.0",
  "numpy>=1.26.0",
  "sympy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
qbank = "engines.ingestion.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["engines*", "apps*"]

[tool.pytest.ini_options]
pythonpath = [".", "engines", "apps"]
testpaths = ["tests"]
markers = [
    "db: marks tests that require a live PostgreSQL database (skipped if database unreachable)",
]
